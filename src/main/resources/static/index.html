<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Calculator</title>
    <style>
        body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: #f4f5f7; margin: 0; }
        .card { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: 600; }
        input, select, button { font-size: 1rem; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #result { font-weight: 600; }
        #message { color: #555; }
        #db { color: #15803d; font-size: .9rem; }
        #db.err { color: #b91c1c; }
        #history { white-space: pre-line; font-size: .9rem; color: #333; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
    <label id="languageLabel" for="lang">Language</label>
    <select id="lang" name="lang"></select>

    <label id="distanceLabel" for="distance">Distance</label>
    <input id="distance" name="distance" inputmode="decimal" required>

    <label id="speedLabel" for="speed">Speed</label>
    <input id="speed" name="speed" inputmode="decimal" required>

    <button id="calc" type="submit">Calculate</button>
    <div id="result"></div>
    <div id="message"></div>
    <div id="db"></div>
    <div id="history"></div>
</form>

<script>
    const $ = id => document.getElementById(id);
    const allowed = /^[0-9۰-۹٠-٩.,٫،\-]*$/;

    // Same input filter as the JavaFX TextFormatter
    for (const f of [$('distance'), $('speed')]) {
        f.addEventListener('beforeinput', e => { if (e.data && !allowed.test(e.data)) e.preventDefault(); });
    }

    async function loadLanguages() {
        const langs = await (await fetch('api/languages')).json();
        $('lang').innerHTML = langs.map(l => `<option value="${l.code}">${l.label}</option>`).join('');
        $('lang').addEventListener('change', () => { clearOutput(); loadI18n(); });
        await loadI18n();
    }

    async function loadI18n() {
        const lang = $('lang').value;
        const data = await (await fetch('api/i18n?lang=' + lang)).json();
        document.documentElement.dir = data.rtl ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        $('languageLabel').textContent = data.labels.language;
        $('distanceLabel').textContent = data.labels.distance;
        $('speedLabel').textContent = data.labels.speed;
        $('calc').textContent = data.labels.calculate;
        $('distance').title = data.units.KM?.description ?? '';
        $('speed').title = data.units.KMH?.description ?? '';
        if (data.dbMessage) showDb(data.dbMessage, true);
        await loadHistory();
    }

    async function loadHistory() {
        const res = await fetch('api/history?lang=' + $('lang').value);
        const data = await res.json();
        $('history').textContent = data.title + '\n' + (data.rows || []).map(r => r.text).join('\n');
    }

    function clearOutput() { $('result').textContent = $('message').textContent = ''; showDb('', false); }
    function showDb(text, err) { $('db').textContent = text; $('db').className = err ? 'err' : ''; }

    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        clearOutput();
        const res = await fetch('api/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: new URLSearchParams(new FormData($('form')))
        });
        const data = await res.json();
        if (!res.ok) { $('message').textContent = data.error; return; }
        $('result').textContent = data.result;
        $('message').textContent = data.message;
        if (data.dbMessage) showDb(data.dbMessage, data.db === 'error');
        $('distance').value = $('speed').value = '';
        $('distance').focus();
        await loadHistory();
    });

    loadLanguages();
</script>
</body>
</html>
